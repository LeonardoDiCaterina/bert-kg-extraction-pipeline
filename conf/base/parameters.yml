# ─── Domain Ontology Schema ───────────────────────────────────────────────────
schema:
  entity_types:
    - "org"
    - "person"
    - "comp"
    - "product"
    - "segment"
    - "fin_metric"
    - "risk_factor"
    - "event"
    - "regulatory_requirement"
    - "esg_topic"
  relation_types:
    - "has_metric"
    - "produces"
    - "operates_in"
    - "reports_risk"
    - "led_by"
    - "has_stake_in"
    - "impacts"
    - "involved_in"
    - "impacted_by"
    - "discloses"
    - "complies_with"
    - "supplies"
    - "partners_with"

# ─── Data Preparation ────────────────────────────────────────────────────────
data_prep:
  raw_pdf_dir: "data/01_raw"
  max_chunk_words: 1500
  max_seq_length: 128
  max_gt_triples: 15
  max_samples: 5000
  use_context_prefix: true     # Inject [Ticker | Year | Section] prefix into tokens
  target_items_regex: "(item\\s+(1|1a|7|7a|8)\\.?\\s+)"
  stop_items_regex: "(item\\s+(9|10|15)\\.?\\s+|signat(ure|ures)|part\\s+iv)"

# ─── Teacher Model (Qwen 72B) ─────────────────────────────────────────────────
teacher:
  model_name: "Qwen/Qwen2.5-72B-Instruct-GPTQ-Int4"
  tensor_parallel_size: 1
  max_model_len: 8192
  gpu_memory_utilization: 0.90
  temperature: 0.1
  max_tokens: 1024
  batch_size: 500                # Stream distillation in micro-batches (persists every 500 chunks to disk)
  max_samples: 5000              # Distill gold triples from 5000 representative chunks (set null for full dataset)
  checkpoint_dir: "data/02_intermediate"  # Auto-save/resume Agent 1, 2, 3 checkpoints
  resume_checkpoints: true       # Resume completed stages without recomputation
  company_map:
    AAPL: "Apple Inc."
    MSFT: "Microsoft Corp."
    AMZN: "Amazon.com, Inc."
    NVDA: "NVIDIA Corporation"
    GOOGL: "Alphabet Inc."
    META: "Meta Platforms, Inc."
    TSLA: "Tesla, Inc."
    JPM: "JPMorgan Chase & Co."
    CSCO: "Cisco Systems, Inc."
    INTC: "Intel Corporation"
    ORCL: "Oracle Corporation"
    CRM: "Salesforce, Inc."
    AMD: "Advanced Micro Devices, Inc."
    QCOM: "QUALCOMM Incorporated"

# ─── Student Model Training ───────────────────────────────────────────────────
training:
  encoder_model_name: "bert-base-uncased"
  decoder_num_layers: 4
  num_queries: 15
  freeze_strategy: "partial"   # options: "all", "partial", "none"
  unfrozen_top_layers: 4
  d_model: 768
  epochs: 10
  learning_rate: 0.00005
  batch_size: 4
  gradient_accumulation_steps: 8
  compile_model: true          # Accelerate training & forward pass with torch.compile
  compile_mode: "default"      # options: "default", "reduce-overhead", "max-autotune"

# ─── Model Inference & Validation ─────────────────────────────────────────────
inference:
  sample_size: 20
  batch_size: 4

# ─── Dataset Splitting (Company-Stratified) ────────────────────────────────────
split:
  strategy: "company_stratified"   # options: "company_stratified", "random"
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  random_seed: 42

# ─── Multi-Encoder Benchmarking ───────────────────────────────────────────────
benchmark:
  models:
    - name: "bert-base-uncased"
      display_name: "BERT Base"
    - name: "ProsusAI/finbert"
      display_name: "FinBERT (ProsusAI)"
    - name: "nlpaueb/sec-bert-base"
      display_name: "SEC-BERT (AUEB)"
    - name: "roberta-base"
      display_name: "RoBERTa Base"
  epochs: 200
  learning_rate: 0.0001
  encoder_learning_rate: 0.00001
  batch_size: 4
  gradient_accumulation_steps: 8
  val_interval_epochs: 5
  early_stopping_patience: 3
  loss_weights:
    loss_ce: 1.0
    loss_type: 2.0
    loss_span: 0.4
  matcher_weights:
    loss_ce: 2.0
    loss_type: 1.0
    loss_span: 0.25
  eos_coef: 0.05
  dynamic_unfreeze_epoch: 20
  freeze_strategy: "partial"       # options: "all", "partial", "none"
  unfrozen_top_layers: 4
  num_queries: 15
  decoder_num_layers: 4
  d_model: 768
  compile_model: true              # Accelerate benchmark models with torch.compile
  compile_mode: "default"
  float32_matmul_precision: "high" # options: "highest", "high", "medium"

# ─── EvalBench Pipeline ─────────────────────────────────────────────────────────
evalbench:
  sample_size: 100               # Number of predicted triples to randomly sample
  judge_models:                  # You can parameterize how many models to summon here!
    - "Qwen/Qwen2.5-72B-Instruct"
    # - "gpt-oss-120b"
    # - "llama-3-nemotron"

# ─── HalluBench Pipeline ────────────────────────────────────────────────────────
hallubench:
  sample_size: 50                # Number of predictions to feed into the simulated QA detector

