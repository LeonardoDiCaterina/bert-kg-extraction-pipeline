# ─── Domain Ontology Schema ───────────────────────────────────────────────────
schema:
  entity_types:
    - "org"
    - "person"
    - "product"
    - "segment"
    - "fin_metric"
    - "risk_factor"
    - "event"
  relation_types:
    - "has_metric"
    - "produces"
    - "operates_in"
    - "reports_risk"
    - "led_by"

# ─── Data Preparation ────────────────────────────────────────────────────────
data_prep:
  raw_pdf_dir: "data/01_raw"
  max_chunk_words: 1500
  max_seq_length: 128
  max_gt_triples: 15
  max_samples: 5000
  target_items_regex: "(item\\s+(1|1a|7|7a|8)\\.?\\s+)"
  stop_items_regex: "(item\\s+(9|10|15)\\.?\\s+|signat(ure|ures)|part\\s+iv)"

# ─── Teacher Model (Qwen 72B) ─────────────────────────────────────────────────
teacher:
  model_name: "Qwen/Qwen2.5-72B-Instruct-GPTQ-Int4"
  tensor_parallel_size: 1
  max_model_len: 8192
  gpu_memory_utilization: 0.90
  temperature: 0.1
  max_tokens: 1024
  company_map:
    AAPL: "Apple Inc."
    MSFT: "Microsoft Corp."
    AMZN: "Amazon.com, Inc."
    NVDA: "NVIDIA Corporation"
    GOOGL: "Alphabet Inc."
    META: "Meta Platforms, Inc."
    TSLA: "Tesla, Inc."
    JPM: "JPMorgan Chase & Co."

# ─── Student Model Training ───────────────────────────────────────────────────
training:
  encoder_model_name: "bert-base-uncased"
  decoder_num_layers: 4
  num_queries: 15
  freeze_strategy: "partial"   # options: "all", "partial", "none"
  unfrozen_top_layers: 4
  d_model: 768
  epochs: 10
  learning_rate: 0.00005
  batch_size: 4
  gradient_accumulation_steps: 8
  compile_model: true          # Accelerate training & forward pass with torch.compile
  compile_mode: "default"      # options: "default", "reduce-overhead", "max-autotune"

# ─── Model Inference & Validation ─────────────────────────────────────────────
inference:
  sample_size: 20
  batch_size: 4

# ─── Dataset Splitting (Company-Stratified) ────────────────────────────────────
split:
  strategy: "company_stratified"   # options: "company_stratified", "random"
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  random_seed: 42

# ─── Multi-Encoder Benchmarking ───────────────────────────────────────────────
benchmark:
  models:
    - name: "bert-base-uncased"
      display_name: "BERT Base"
    - name: "ProsusAI/finbert"
      display_name: "FinBERT (ProsusAI)"
    - name: "nlpaueb/sec-bert-base"
      display_name: "SEC-BERT (AUEB)"
    - name: "roberta-base"
      display_name: "RoBERTa Base"
  epochs: 5
  learning_rate: 0.00005
  batch_size: 4
  gradient_accumulation_steps: 8
  freeze_strategy: "partial"       # options: "all", "partial", "none"
  unfrozen_top_layers: 4
  num_queries: 15
  decoder_num_layers: 4
  d_model: 768
  compile_model: true              # Accelerate benchmark models with torch.compile
  compile_mode: "default"


